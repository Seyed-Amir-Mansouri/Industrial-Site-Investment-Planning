<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Site Investment Planner{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script>
  (function () {
    try {
      const saved = localStorage.getItem('sip-theme');
      if (saved === 'light' || saved === 'dark') document.documentElement.setAttribute('data-theme', saved);
    } catch (e) {}
  })();
  window.sipTheme = function () {
    const set = document.documentElement.getAttribute('data-theme');
    if (set === 'light' || set === 'dark') return set;
    return window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  };
  window.sipChart = function () {
    const css = getComputedStyle(document.documentElement);
    const dark = window.sipTheme() === 'dark';
    return {
      series: dark ? ['#3987e5', '#d95926'] : ['#2a78d6', '#eb6834'],
      ink: css.getPropertyValue('--ink').trim(),
      muted: css.getPropertyValue('--muted').trim(),
      line: css.getPropertyValue('--line').trim(),
      font: css.getPropertyValue('--sans').trim(),
    };
  };
  window.sipChartDefaults = function () {
    if (typeof Chart === 'undefined') return;
    const c = window.sipChart();
    Chart.defaults.color = c.muted;
    Chart.defaults.borderColor = c.line;
    Chart.defaults.font.family = c.font;
    Chart.defaults.font.size = 12;
    Chart.defaults.plugins.legend.labels.usePointStyle = true;
    Chart.defaults.plugins.legend.labels.boxWidth = 8;
  };
</script>
<style>
  :root {
    color-scheme: dark;
    --bg: #0c0d10; --bg-glow: #17140e; --surface: #14161b; --surface-2: #1a1d23; --surface-3: #22262e;
    --ink: #f2ede3; --ink-2: #cfc9bd; --muted: #8f8a80; --line: rgba(242, 237, 227, .09); --line-2: rgba(242, 237, 227, .16);
    --gold: #c9a96e; --gold-2: #e3c993; --gold-ink: #17140e; --gold-soft: rgba(201, 169, 110, .12); --gold-line: rgba(201, 169, 110, .45);
    --ok: #8fc49b; --ok-soft: rgba(143, 196, 155, .12); --warn: #e3b866; --warn-soft: rgba(227, 184, 102, .12);
    --bad: #e7958a; --bad-soft: rgba(231, 149, 138, .12); --run: #9dbcf0; --run-soft: rgba(157, 188, 240, .12);
    --brand: var(--gold); --brand-ink: var(--gold-ink); --brand-soft: var(--gold-soft);
    --radius: 18px; --radius-sm: 12px;
    --shadow: 0 1px 0 rgba(255, 255, 255, .03) inset, 0 24px 48px -32px rgba(0, 0, 0, .8);
    --serif: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    --sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      color-scheme: light;
      --bg: #f5f1e8; --bg-glow: #ece3cf; --surface: #fffdf8; --surface-2: #faf6ee; --surface-3: #f1ebdf;
      --ink: #1c1a16; --ink-2: #3d3a33; --muted: #77716a; --line: rgba(28, 26, 22, .10); --line-2: rgba(28, 26, 22, .18);
      --gold: #9b7637; --gold-2: #7d5d27; --gold-ink: #fffdf8; --gold-soft: rgba(155, 118, 55, .10); --gold-line: rgba(155, 118, 55, .45);
      --ok: #2f7a45; --ok-soft: rgba(47, 122, 69, .10); --warn: #9a6a12; --warn-soft: rgba(154, 106, 18, .10);
      --bad: #b23f33; --bad-soft: rgba(178, 63, 51, .10); --run: #2d5fae; --run-soft: rgba(45, 95, 174, .10);
      --shadow: 0 1px 0 rgba(255, 255, 255, .6) inset, 0 24px 48px -36px rgba(60, 45, 20, .45);
    }
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #f5f1e8; --bg-glow: #ece3cf; --surface: #fffdf8; --surface-2: #faf6ee; --surface-3: #f1ebdf;
    --ink: #1c1a16; --ink-2: #3d3a33; --muted: #77716a; --line: rgba(28, 26, 22, .10); --line-2: rgba(28, 26, 22, .18);
    --gold: #9b7637; --gold-2: #7d5d27; --gold-ink: #fffdf8; --gold-soft: rgba(155, 118, 55, .10); --gold-line: rgba(155, 118, 55, .45);
    --ok: #2f7a45; --ok-soft: rgba(47, 122, 69, .10); --warn: #9a6a12; --warn-soft: rgba(154, 106, 18, .10);
    --bad: #b23f33; --bad-soft: rgba(178, 63, 51, .10); --run: #2d5fae; --run-soft: rgba(45, 95, 174, .10);
    --shadow: 0 1px 0 rgba(255, 255, 255, .6) inset, 0 24px 48px -36px rgba(60, 45, 20, .45);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 14.5px/1.6 var(--sans); -webkit-font-smoothing: antialiased;
         background-image: radial-gradient(1200px 600px at 85% -10%, var(--bg-glow), transparent 60%); background-attachment: fixed; }
  a { color: var(--gold); text-decoration: none; }
  a:hover { color: var(--gold-2); }
  ::selection { background: var(--gold-soft); }

  .shell { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100vh; }
  .sidebar { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 28px;
             padding: 28px 18px 22px; border-right: 1px solid var(--line); background: color-mix(in srgb, var(--surface) 70%, transparent);
             backdrop-filter: blur(10px); }
  .brand { display: flex; align-items: center; gap: 12px; color: var(--ink); padding: 0 8px; }
  .brand:hover { color: var(--ink); }
  .monogram { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; flex-shrink: 0;
              border: 1px solid var(--gold-line); background: linear-gradient(145deg, var(--gold-soft), transparent);
              font: 600 18px var(--serif); color: var(--gold); letter-spacing: .02em; }
  .brand-name { font: 600 17px/1.15 var(--serif); }
  .brand-name small { display: block; font: 600 10px var(--sans); letter-spacing: .18em; text-transform: uppercase; color: var(--muted); margin-top: 3px; }
  .nav { display: flex; flex-direction: column; gap: 4px; }
  .nav-label { font: 700 10px var(--sans); letter-spacing: .18em; text-transform: uppercase; color: var(--muted); padding: 0 12px 8px; }
  .nav a { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 12px; color: var(--ink-2);
           font-weight: 600; font-size: 14px; border: 1px solid transparent; transition: background .2s, color .2s, border-color .2s; }
  .nav a svg { width: 18px; height: 18px; flex-shrink: 0; stroke: currentColor; fill: none; stroke-width: 1.6; opacity: .8; }
  .nav a:hover { background: var(--surface-2); color: var(--ink); }
  .nav a.active { background: var(--gold-soft); color: var(--gold); border-color: var(--gold-line); }
  .nav a.active svg { opacity: 1; }
  .sidebar-foot { margin-top: auto; display: flex; flex-direction: column; gap: 12px; padding: 0 8px; }
  .theme-toggle { display: inline-flex; align-items: center; gap: 10px; background: none; border: 1px solid var(--line-2);
                  color: var(--ink-2); border-radius: 999px; padding: 8px 14px; font: 600 12px var(--sans); cursor: pointer; }
  .theme-toggle:hover { border-color: var(--gold-line); color: var(--gold); }
  .theme-toggle svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.7; }
  .sidebar-note { font-size: 11.5px; color: var(--muted); line-height: 1.5; }

  main { padding: 48px clamp(20px, 4vw, 64px) 96px; max-width: 1320px; width: 100%; }
  .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; margin-bottom: 36px; flex-wrap: wrap;
               padding-bottom: 28px; border-bottom: 1px solid var(--line); }
  .page-head .eyebrow { font: 700 11px var(--sans); letter-spacing: .2em; text-transform: uppercase; color: var(--gold); margin-bottom: 12px; }
  h1 { font: 600 clamp(28px, 3vw, 40px)/1.1 var(--serif); letter-spacing: -.025em; margin: 0 0 12px; }
  h2 { font: 600 19px/1.3 var(--serif); letter-spacing: -.01em; margin: 0 0 6px; }
  h3 { font: 600 17px/1.3 var(--serif); margin: 0; }
  .lede { color: var(--muted); margin: 0; max-width: 760px; }
  code { font: 12.5px ui-monospace, "SF Mono", Consolas, monospace; background: var(--surface-3); color: var(--ink-2);
         padding: 2px 7px; border-radius: 6px; border: 1px solid var(--line); }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--gold); cursor: pointer;
         padding: 11px 22px; border-radius: 999px; font: 700 13px var(--sans); letter-spacing: .04em;
         background: linear-gradient(180deg, var(--gold-2), var(--gold)); color: var(--gold-ink); transition: transform .15s, box-shadow .2s, filter .2s; }
  .btn:hover { color: var(--gold-ink); transform: translateY(-1px); box-shadow: 0 10px 24px -12px var(--gold); }
  .btn.ghost { background: transparent; color: var(--ink-2); border-color: var(--line-2); }
  .btn.ghost:hover { color: var(--gold); border-color: var(--gold-line); box-shadow: none; }
  .btn:disabled, .btn[disabled] { opacity: .45; cursor: not-allowed; transform: none; box-shadow: none; }

  .card { position: relative; background: linear-gradient(180deg, var(--surface-2), var(--surface)); border: 1px solid var(--line);
          border-radius: var(--radius); box-shadow: var(--shadow); padding: 28px 30px; margin-bottom: 22px; }
  .card::before { content: ""; position: absolute; inset: 0 24px auto; height: 1px; border-radius: 1px;
                  background: linear-gradient(90deg, transparent, var(--gold-line), transparent); opacity: .6; }
  .grid { display: grid; gap: 16px; }
  .grid.kpis { grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
  .kpi { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
         padding: 20px 22px 18px; overflow: hidden; }
  .kpi::after { content: ""; position: absolute; left: 22px; right: 22px; bottom: 0; height: 2px; background: linear-gradient(90deg, var(--gold), transparent); opacity: .55; }
  .kpi .label { color: var(--muted); font: 700 10.5px var(--sans); text-transform: uppercase; letter-spacing: .16em; }
  .kpi .value { font: 600 clamp(21px, 1.9vw, 26px)/1.2 var(--serif); margin-top: 10px; font-variant-numeric: tabular-nums lining-nums; letter-spacing: -.01em; overflow-wrap: normal; word-break: normal; }
  .kpi .sub { color: var(--muted); font-size: 12px; margin-top: 6px; }

  .badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 11px; border-radius: 999px; font: 700 11px var(--sans);
           letter-spacing: .06em; text-transform: uppercase; border: 1px solid transparent; }
  .badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .badge.done { background: var(--ok-soft); color: var(--ok); border-color: color-mix(in srgb, var(--ok) 30%, transparent); }
  .badge.running { background: var(--run-soft); color: var(--run); border-color: color-mix(in srgb, var(--run) 30%, transparent); }
  .badge.running::before { animation: pulse 1.6s ease-in-out infinite; }
  .badge.failed { background: var(--bad-soft); color: var(--bad); border-color: color-mix(in srgb, var(--bad) 30%, transparent); }
  @keyframes pulse { 50% { opacity: .25; } }

  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 13px 14px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font: 700 10.5px var(--sans); text-transform: uppercase; letter-spacing: .14em; }
  tbody tr { transition: background .15s; }
  tbody tr:hover { background: color-mix(in srgb, var(--gold) 4%, transparent); }
  td.num, th.num { text-align: right; }
  td strong, td:first-child { white-space: nowrap; }
  tr:last-child td { border-bottom: 0; }

  .alert { padding: 14px 18px; border-radius: var(--radius-sm); margin-bottom: 20px; font-weight: 600; border: 1px solid transparent; }
  .alert.error { background: var(--bad-soft); color: var(--bad); border-color: color-mix(in srgb, var(--bad) 30%, transparent); }
  .alert.success { background: var(--ok-soft); color: var(--ok); border-color: color-mix(in srgb, var(--ok) 30%, transparent); }
  .alert.info { background: var(--run-soft); color: var(--run); border-color: color-mix(in srgb, var(--run) 30%, transparent); }

  pre.log { background: #08090b; color: #cfc9bd; padding: 18px; border-radius: var(--radius-sm); overflow: auto; border: 1px solid var(--line);
            max-height: 360px; font: 12px/1.6 ui-monospace, Consolas, monospace; }

  @media (max-width: 900px) {
    .shell { grid-template-columns: 1fr; }
    .sidebar { position: sticky; z-index: 20; height: auto; flex-direction: row; flex-wrap: wrap; align-items: center; gap: 12px; padding: 14px 16px; border-right: 0; border-bottom: 1px solid var(--line); }
    .nav { flex-direction: row; flex-wrap: wrap; }
    .nav-label, .sidebar-note, .brand-name small { display: none; }
    .nav a { padding: 8px 10px; }
    .sidebar-foot { margin: 0 0 0 auto; padding: 0; }
    main { padding: 28px 16px 72px; }
    .card { padding: 22px 18px; }
  }
</style>
{% block head %}{% endblock %}
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <a class="brand" href="{% url 'index' %}">
      <span class="monogram">S</span>
      <span class="brand-name">Site Investment<small>Planner</small></span>
    </a>
    <nav class="nav">
      <div class="nav-label">Workspace</div>
      <a href="{% url 'index' %}" class="{% if request.resolver_match.url_name == 'index' or request.resolver_match.url_name == 'run_detail' %}active{% endif %}">
        <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Runs</a>
      <a href="{% url 'new_run' %}" class="{% if request.resolver_match.url_name == 'new_run' %}active{% endif %}">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 8v8M8 12h8"/></svg>New run</a>
      <a href="{% url 'compare' %}" class="{% if request.resolver_match.url_name == 'compare' %}active{% endif %}">
        <svg viewBox="0 0 24 24"><path d="M7 4v16M17 4v16M3 8h8M13 16h8"/></svg>Compare</a>
      <a href="{% url 'catalog' %}" class="{% if request.resolver_match.url_name == 'catalog' %}active{% endif %}">
        <svg viewBox="0 0 24 24"><path d="M5 4h11l3 3v13H5z"/><path d="M8 10h8M8 14h8M8 18h5"/></svg>Catalog</a>
    </nav>
    <div class="sidebar-foot">
      <button type="button" class="theme-toggle" id="theme-toggle">
        <svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg><span>Light / dark</span>
      </button>
      <div class="sidebar-note">Industrial site location, technology and capacity planning across the Core region.</div>
    </div>
  </aside>
  <main>
    {% for message in messages %}
      <div class="alert {{ message.tags }}">{{ message }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
</div>
<script>
  (function () {
    const btn = document.getElementById('theme-toggle');
    if (!btn) return;
    btn.addEventListener('click', function () {
      const root = document.documentElement;
      const current = root.getAttribute('data-theme')
        || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      const next = current === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      try { localStorage.setItem('sip-theme', next); } catch (e) {}
      window.dispatchEvent(new CustomEvent('sip-theme', { detail: next }));
    });
  })();
</script>
</body>
</html>
